# frontend/nginx.conf — :80 redirect + :443 TLS (SPA + reverse proxy).
# DOCKER-PR1-06 (REQ-DOCKER-002 + REQ-DOCKER-008), design §5 verbatim.
#
# HSTS intentionally OFF: a self-signed cert with a cached HSTS pin would
# brick the reviewer's localhost on any future cert change (see design Risks).

# --- HTTP → HTTPS redirect (Decision #11) ---
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# --- TLS single origin (Decision #4, #12) ---
server {
    listen 443 ssl;
    http2  on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;          # 1.0/1.1 refused (Decision #12)
    # Mozilla intermediate cipher suite (pinned, not "sane defaults").
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # NO add_header Strict-Transport-Security (self-signed → would brick localhost).

    root  /usr/share/nginx/html;
    index index.html;

    # SPA deep-link fallback (React Router client-side routes: /albums/:id etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend. NO trailing slash on proxy_pass (REQ-DOCKER-008):
    # with no URI, nginx forwards the original request path unchanged
    # (/api/v1/auth/login → backend:3000/api/v1/auth/login), preserving the
    # /api/v1 prefix so the backend's global prefix matches AND the refresh
    # cookie path=/api/v1/auth attaches on /auth/refresh.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health probe — main.ts excludes /health from the /api/v1 prefix.
    location = /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
    }
}
